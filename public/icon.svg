<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232A"/>
      <stop offset="100%" stop-color="#0F1318"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F0"/>
      <stop offset="100%" stop-color="#E9E1CC"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 배경 둥근 사각형 -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- 내부 글로우 테두리 -->
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3"/>

  <!-- 메인 심볼: 펼쳐진 책과 주파수(튜닝) 웨이브 -->
  <g filter="url(#softShadow)" transform="translate(64, 88)">
    <!-- 책의 왼쪽 페이지 -->
    <path d="M192 280 C130 250 50 255 10 270 L10 110 C50 95 130 90 192 120 Z" 
          fill="url(#pageGrad)" />
    <!-- 책의 오른쪽 페이지 -->
    <path d="M192 280 C254 250 334 255 374 270 L374 110 C334 95 254 90 192 120 Z" 
          fill="url(#pageGrad)" />
    <!-- 책등 중앙선 -->
    <line x1="192" y1="120" x2="192" y2="280" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>

    <!-- 튜닝 주파수(Soundwave) & 삶의 펄스 라인 -->
    <path d="M40 185 C80 185 100 135 125 215 C145 280 165 80 192 170 C220 260 240 100 260 210 C285 140 305 185 344 185" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- 튜닝 포인트 앵커 (다이아몬드/별) -->
    <circle cx="192" cy="170" r="10" fill="#FFFBEB" stroke="#D97706" stroke-width="4"/>
  </g>

  <!-- 하단 서브 텍스트 / 포인트 점 -->
  <circle cx="256" cy="428" r="6" fill="#F59E0B"/>
  <circle cx="232" cy="428" r="4" fill="#9BA3AF" opacity="0.6"/>
  <circle cx="280" cy="428" r="4" fill="#9BA3AF" opacity="0.6"/>
</svg>
